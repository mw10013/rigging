name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # rigging server reads ports and processes with lsof and ps, which the runner image ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # rigging server rotates its logs with s6-log.
      - run: sudo apt-get update && sudo apt-get install -y s6
      - run: pnpm install --frozen-lockfile
      # The server tests spawn `vpx` by name.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp check
      - run: vp test run
      # The npm that Publish packs with.
      - run: npm install -g npm@latest
      - run: vp run smoke
