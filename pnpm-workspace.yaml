packages:
  - fixtures/*
saveExact: true
runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  # Alchemy depends on workerd; rigging only types and plans against Alchemy, never runs a Worker.
  workerd: false
catalog:
  "@vitest/browser-playwright": 5.1.0
  playwright: 1.65.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
